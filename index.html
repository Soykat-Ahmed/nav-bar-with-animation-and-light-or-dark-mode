<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxurious Navbar with Dark and Light Mode</title>
  <!-- Include Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Reset default margins and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    /* Define light and dark mode color variables */
    :root {
      --bg-color: #f7f7f7;
      --text-color: #333;
      --navbar-bg-color: #333;
      --button-bg-color: #3aeb0e;
      --hover-color: #f4b400;
      --link-color: #fff;
    }

    /* Dark mode color variables */
    .dark-mode {
      --bg-color: #333;
      --text-color: #fff;
      --navbar-bg-color: #444;
      --button-bg-color: #444;
      --hover-color: #ff5733;
      --link-color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: var(--navbar-bg-color);
      color: var(--link-color);
      max-width: 1100px;
      margin: 0 auto;
      overflow: hidden;
      animation: fadeIn 1s ease-in-out;
    }

    /* Logo and Brand Styling */
    .brand {
      display: flex;
      align-items: center;
    }

    .brand img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
      border-radius: 50%;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--hover-color);
      animation: slideInLeft 1s ease-in-out;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links li a {
      color: var(--link-color);
      background-color: var(--button-bg-color);
      text-decoration: none;
      font-size: 1rem;
      padding: 10px 15px;
      border-radius: 4px;
      transition: background 0.5s, color 0.5s, transform 0.3s;
    }

    .nav-links li a:hover {
      background-color: var(--hover-color);
      color: var(--text-color);
      transform: scale(1.1);
    }

    /* Dark/Light mode toggle button */
    .toggle-container {
      display: flex;
      align-items: center;
    }

    .toggle-button {
      cursor: pointer;
      background-color: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.5rem;
      transition: color 0.5s;
    }

    /* Responsive styling */
    @media (max-width: 768px) {
      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        height: 100vh;
        width: 60%;
        background-color: var(--navbar-bg-color);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: right 0.6s ease;
        gap: 20px;
      }

      .nav-links.active {
        right: 0;
      }

      .hamburger {
        display: flex;
      }
    }

    /* Animation Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInLeft {
      from { transform: translateX(-100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <!-- Brand logo and name -->
    <div class="brand">
      <img src="images/light-logo.png" alt="Logo" id="logo" class="logo">
      <div class="brand-name">MyBrand</div>
    </div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="toggle-container">
      <!-- Toggle button with Font Awesome icons -->
      <button class="toggle-button" onclick="toggleDarkMode()">
        <i class="fas fa-sun" id="sun-icon"></i>
        <i class="fas fa-moon" id="moon-icon" style="display: none;"></i>
      </button>
    </div>
  </nav>

  <script>
    function toggleDarkMode() {
      const body = document.body;
      const logo = document.getElementById('logo');
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');
      
      body.classList.toggle('dark-mode');
      
      // Switch logo and icon based on mode
      if (body.classList.contains('dark-mode')) {
        logo.src = 'images/dark-logo.png'; // Path to dark mode logo
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'inline-block';
      } else {
        logo.src = 'images/light-logo.png'; // Path to light mode logo
        sunIcon.style.display = 'inline-block';
        moonIcon.style.display = 'none';
      }
    }
  </script>
</body>
</html>
